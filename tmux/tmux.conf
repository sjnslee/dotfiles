# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================
# Prefix: backtick (`) instead of default Ctrl-b
unbind C-b
set-option -g prefix `
bind-key ` send-prefix

# Quality of life
set -g mouse on
set-option -g allow-rename off
set -g history-limit 10000

# Forward terminal focus events to programs inside panes. Without this, nvim
# never fires FocusGained/FocusLost, so autoread never notices files changed on
# disk outside the editor (e.g. edited over SSH on tsumpc).
set -g focus-events on

# Use OSC 52 to push tmux/nvim yanks up to the host clipboard. Works through
# SSH, so yanking on tsumpc lands in the macOS clipboard via Ghostty.
set -g set-clipboard on

# Let programs inside panes send escape sequences tmux doesn't understand
# straight through to the terminal. Needed for the kitty graphics protocol, so
# nvim (snacks.image, molten plot output) can draw images inside tmux.
set -g allow-passthrough on

# vi keys in copy mode (was emacs, inconsistent with everything else here)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Start window/pane numbering at 1 (to match keyboard) and keep them tidy
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==============================================================================
# NAVIGATION & SHORTCUTS
# ==============================================================================
# Reload this config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and - (staying in current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes using h,j,k,l (vim-style)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Resize panes using H,J,K,L (repeatable, 5 cells per step)
# Avoids Ctrl/Alt+arrow, which macOS Mission Control can intercept
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# ==============================================================================
# KANAGAWA DRAGON THEME & STATUS LINE
# ==============================================================================
# Matches Ghostty's "Kanagawa Dragon" theme and nvim's kanagawa-dragon.
# Palette (from /Applications/Ghostty.app/.../themes/Kanagawa Dragon):
#   bg    #181616   fg      #c5c9c5   black0 #0d0c0c   black4 #282727
#   blue  #8ba4b0   green   #87a987   yellow #c4b28a   orange #b6927b
#   red   #c4746e   violet  #8992a7   gray   #a6a69c   ash    #7a8382
#   bright: blue #7fb4ca  red #e46876  yellow #e6c384  aqua #7aa89f
# ==============================================================================
# Ensure 24-bit color support
set -g default-terminal "tmux-256color"
# Ghostty reports TERM=xterm-ghostty, so match all outer terminals, not just
# xterm-256color -- otherwise the hex colors below get quantized to 256-color.
# Set (not append) so repeated `prefix + r` reloads stay idempotent; the leading
# entries below are tmux's own defaults, preserved verbatim.
set -g terminal-overrides "linux*:AX@,*:Tc"
set -g terminal-features "screen*:title,rxvt*:ignorefkeys,xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,*:RGB"

# Pass modified keys (shift/ctrl/alt + enter, etc.) through to apps that ask for
# them, instead of collapsing them to the unmodified key.
set -s extended-keys on

# Status bar
set -g status-position top
set -g status-justify left
# Slightly darker than the terminal background (#181616) so the bar reads as a
# bar without the hard slab of contrast Gruvbox had.
set -g status-style 'bg=#0d0c0c fg=#c5c9c5'

# Left: session name (dragon blue)
set -g status-left "#[fg=#8ba4b0,bold] #S #[default] "
set -g status-left-length 20

# Right: CPU | battery | clock, via cross-platform helper scripts
# (macOS top/pmset don't exist on Linux, hence the wrapper scripts)
set -g status-right-length 100
set -g status-right "#[fg=#8ba4b0] CPU #(~/.config/tmux/cpu.sh) #[fg=#282727]|#[fg=#b6927b] Bat #(~/.config/tmux/bat.sh) #[fg=#282727]|#[fg=#c4b28a] %H:%M:%S "

# Window tabs (inactive / active)
setw -g window-status-style 'fg=#7a8382'
setw -g window-status-format ' #I:#W '
# Bright blue, not the normal #8ba4b0 -- that one already marks the session name
# and the active pane border, so the active tab would blend into both.
setw -g window-status-current-style 'fg=#7fb4ca,bold,underscore'
setw -g window-status-current-format ' #I:#W '
# Activity/bell defaulted to `reverse`, which inverts to raw terminal colors
setw -g window-status-activity-style 'fg=#c4b28a'
setw -g window-status-bell-style 'fg=#c4746e,bold'
setw -g window-status-last-style 'fg=#a6a69c'

# Pane borders
set -g pane-border-style 'fg=#282727'
set -g pane-active-border-style 'fg=#8ba4b0'

# Clock mode (prefix + t)
setw -g clock-mode-colour '#b6927b'

# Pane indicators (prefix + q). Defaulted to plain blue/red.
set -g display-panes-colour '#7a8382'
set -g display-panes-active-colour '#8ba4b0'

# Messages & copy mode
set -g message-style 'fg=#181616 bg=#c4b28a bold'
setw -g mode-style 'fg=#181616 bg=#c4b28a bold'

# Copy-mode search hits. Defaulted to ANSI cyan/magenta/red, which ignored the
# palette entirely -- dim yellow for all matches, solid yellow for the current.
set -g copy-mode-match-style 'bg=#282727,fg=#c4b28a'
set -g copy-mode-current-match-style 'bg=#c4b28a,fg=#181616,bold'
set -g copy-mode-mark-style 'bg=#c4746e,fg=#181616'

# Menus (prefix + right-click) and popups (display-popup)
set -g menu-style 'bg=#0d0c0c,fg=#c5c9c5'
set -g menu-selected-style 'bg=#282727,fg=#c4b28a,bold'
set -g menu-border-style 'fg=#282727'
set -g popup-style 'bg=#181616,fg=#c5c9c5'
set -g popup-border-style 'fg=#282727'
